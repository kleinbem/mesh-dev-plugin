name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml and plugin.toml versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)
          plugin_ver=$(awk -F'"' '/^version =/{print $2; exit}' plugin.toml)
          echo "tag=${tag_ver} Cargo.toml=${cargo_ver} plugin.toml=${plugin_ver}"
          test "$tag_ver" = "$cargo_ver"
          test "$tag_ver" = "$plugin_ver"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build release binary
        run: cargo build --locked --release --bin mesh-dev

      - name: Package and smoke-test Unix plugin archive
        if: matrix.archive == 'tar.gz'
        run: |
          version=$(awk -F'"' '/^version =/{print $2; exit}' plugin.toml)
          stable="mesh-dev-${{ matrix.target }}"
          versioned="mesh-dev-${version}-${{ matrix.target }}"
          root="${stable}/mesh-dev"
          mkdir -p "$root"
          cp target/release/mesh-dev "$root/mesh-dev"
          ./target/release/mesh-dev manifest > "$root/plugin-manifest.json"
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - "$root/mesh-dev"
            codesign --verify --strict "$root/mesh-dev"
          fi
          cp plugin.toml "$root/plugin.toml"
          cp README.md "$root/README.md"
          cp LICENSE "$root/LICENSE"
          tar czf "${stable}.tar.gz" -C "$stable" mesh-dev
          cp "${stable}.tar.gz" "${versioned}.tar.gz"
          sha256sum "${stable}.tar.gz" > "${stable}.tar.gz.sha256"
          sha256sum "${versioned}.tar.gz" > "${versioned}.tar.gz.sha256"
          mkdir -p smoke-extract
          tar xzf "${stable}.tar.gz" -C smoke-extract
          ./smoke-extract/mesh-dev/mesh-dev --help

      - name: Package and smoke-test Windows plugin archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = (Select-String -Path plugin.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $stable = "mesh-dev-${{ matrix.target }}"
          $versioned = "mesh-dev-$version-${{ matrix.target }}"
          $root = "$stable\mesh-dev"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item target\release\mesh-dev.exe "$root\mesh-dev.exe"
          .\target\release\mesh-dev.exe manifest | Out-File -Encoding utf8NoBOM "$root\plugin-manifest.json"
          Copy-Item plugin.toml "$root\plugin.toml"
          Copy-Item README.md "$root\README.md"
          Copy-Item LICENSE "$root\LICENSE"
          Compress-Archive -Path "$root" -DestinationPath "$stable.zip" -Force
          Copy-Item "$stable.zip" "$versioned.zip" -Force
          $hash = (Get-FileHash "$stable.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stable.zip" | Out-File -Encoding ascii "$stable.zip.sha256"
          "$hash  $versioned.zip" | Out-File -Encoding ascii "$versioned.zip.sha256"
          Expand-Archive -Path "$stable.zip" -DestinationPath "smoke-extract" -Force
          .\smoke-extract\mesh-dev\mesh-dev.exe --help

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mesh-dev-${{ matrix.target }}
          path: |
            mesh-dev-*.tar.gz
            mesh-dev-*.tar.gz.sha256
            mesh-dev-*.zip
            mesh-dev-*.zip.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            artifacts/*.tar.gz \
            artifacts/*.tar.gz.sha256 \
            artifacts/*.zip \
            artifacts/*.zip.sha256 \
            --generate-notes
